<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Duck Library{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header a { color: inherit; text-decoration: none; }
    h1 { margin-bottom: .25rem; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #ddd; }
    th { background: #f6f6f6; }
    .flash { padding: .6rem .8rem; border-radius: 6px; margin: 1rem 0; }
    .flash.success { background: #e6f4ea; border: 1px solid #9bd3ab; }
    .flash.error { background: #fdecea; border: 1px solid #f1a9a0; }
    .status { font-weight: 600; }
    .status.ok { color: #1e7b34; }
    .status.soon { color: #b26a00; }
    .status.overdue { color: #c62828; }
    .status.returned { color: #777; font-weight: normal; }
    .muted { color: #666; }
    button { cursor: pointer; padding: .3rem .8rem; }
  </style>
</head>
<body>
  <header><h1><a href="{{ url_for('index') }}">🦆 Rubber-Duck Lending Library</a></h1></header>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
